name: Iran Monitor Advanced

on:
  schedule:
    - cron: '0 */6 * * *'  # every 6 hours
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Get timestamp
        id: time
        run: echo "ts=$(date +'%Y-%m-%d_%H-%M')" >> $GITHUB_OUTPUT

      - name: Fetch Polymarket
        run: curl -s "https://polymarket.com/event/us-forces-enter-iran-by" > data.html

      - name: Fetch News
        run: curl -s "https://news.google.com/rss/search?q=US+Iran+troops" > news.xml

      - name: Build report
        run: |
          mkdir -p reports
          FILE="reports/report_${{ steps.time.outputs.ts }}.txt"
          echo "IRAN MONITOR REPORT - ${{ steps.time.outputs.ts }}" > $FILE
          echo "\n=== POLYMARKET ===" >> $FILE
          grep -i "price" data.html >> $FILE || echo "No price found" >> $FILE
          echo "\n=== NEWS ===" >> $FILE
          grep -i "Iran" news.xml | head -n 20 >> $FILE || echo "No news found" >> $FILE

      - name: Commit report
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add reports/
          git commit -m "Add report ${{ steps.time.outputs.ts }}" || echo "No changes"
          git push
